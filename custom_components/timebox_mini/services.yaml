action:
  name: Timebox Mini action
  description: Do some action on Timebox Mini like new view, volume set, time set...
  fields:

    mac_addr:
      name: MAC address
      description: Bluetooth MAC address of the Timebox
      required: true
      example: "11:75:58:7B:8B:29"
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        text:

    action:
      name: Action
      description: The action to make on the timebox
      required: true
      example: "weather"
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        select:
          options:
            - "weather"
            - "image"
            - "animation"
            - "clock"
            - "moving_text"
            - "attention_sound"
            - "set_volume"
            - "set_time"
            - "set_brightness"

    image:
      name: Image name
      description: Name of the image to display for 'image' action
      required: false
      example: "green_check"
      default: "home_assistant_black"
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        select:
          options:
            - "big_bell_black"
            - "big_bell"
            - "black"
            - "green_check_black"
            - "green_check"
            - "home_assistant_black"
            - "home_assistant"
            - "home_black"
            - "home"
            - "hourglass_black"
            - "hourglass_white"
            - "locked_black"
            - "locked"
            - "orange_warning_black"
            - "orange_warning"
            - "red_cross_black"
            - "red_cross"
            - "small_bell_black"
            - "small_bell"
            - "spanner"
            - "spanner_rev"
            - "spanner_tilted"
            - "spanner_tilted_rev"
            - "unlocked_black"
            - "unlocked"
            - "wifi_no"
            - "wifi"
            - "wifi_no_black"
            - "wifi_black"

    animation:
      name: Animation name
      description: Name of the animation to display for 'animation' action
      required: false
      example: "orange_warning"
      default: "hourglass_black"
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        select:
          options:
            - "green_check_black"
            - "green_check"
            - "hourglass_black"
            - "hourglass_white"
            - "locked"
            - "orange_warning_black"
            - "orange_warning"
            - "red_cross_black"
            - "red_cross"
            - "wifi_black"
            - "wifi"
            - "wifi_no_black"
            - "wifi_no"


    volume:
      name: Audio volume
      description: Audio volume level for 'set_volume' action
      required: false
      example: 8
      default: 4
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: slider

    brightness:
      name: Brightness
      description: Brightness level for 'set_brightness' action
      required: false
      example: 75
      default: 50
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        number:
          min: 0
          max: 100
          step: 5
          mode: slider
          unit_of_measurement: "%"

    text:
      name: Text
      description: Text to scroll for 'moving_text' action
      required: false
      example: "DOOR OPEN"
      selector:
        text:

    color:
      name: Text color
      description: Text color for 'moving_text' action
      required: false
      default:
        - 255
        - 255
        - 255
      selector:
        color_rgb:

    background_color:
      name: Background color
      description: Background color for 'moving_text' action
      required: false
      default:
        - 0
        - 0
        - 0
      selector:
        color_rgb:

    speed:
      name: Text speed
      description: Scroll speed for 'moving_text' action
      required: false
      example: 10
      default: 10
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider

    repeat:
      name: Repeat
      description: Number of times to repeat the generated text animation
      required: false
      example: 1
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider

    direction:
      name: Direction
      description: Scroll direction for 'moving_text' action
      required: false
      default: "left"
      selector:
        select:
          options:
            - "left"
            - "right"

    sound:
      name: Attention sound
      description: Play a built-in Timebox sound briefly before moving text is displayed
      required: false
      default: false
      selector:
        boolean:

    sound_mode:
      name: Built-in sound
      description: Built-in Timebox sound number for moving_text or attention_sound
      required: false
      example: 4
      default: 4
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box

    sound_volume:
      name: Sound volume
      description: Speaker volume for the attention sound (0-15)
      required: false
      example: 8
      default: 8
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: slider

    sound_duration:
      name: Sound duration
      description: Seconds before the built-in attention sound is stopped
      required: false
      example: 3
      default: 3
      selector:
        number:
          min: 0.2
          max: 30
          step: 0.2
          mode: slider
          unit_of_measurement: s
